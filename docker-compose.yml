version: '3.8'

services:
  web:
    build: 
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --limit-concurrency 2000 --backlog 2048 --workers 4
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - REDIS_URI=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - MOCK_LLM_FOR_LOAD_TEST=${MOCK_LLM_FOR_LOAD_TEST:-false}
    depends_on:
      - mongodb
      - redis
    networks:
      - cortex_net

  worker:
    build: 
      context: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./backend:/app
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - REDIS_URI=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - MOCK_LLM_FOR_LOAD_TEST=${MOCK_LLM_FOR_LOAD_TEST:-false}
    depends_on:
      - mongodb
      - redis
    networks:
      - cortex_net

  redis:
    image: redis:alpine
    # ports:
    #   - "6379:6379"
    networks:
      - cortex_net

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - cortex_net

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - cortex_net

  locust:
    image: locustio/locust
    ports:
      - "8089:8089"
    volumes:
      - ./load_testing:/mnt/locust
    command: -f /mnt/locust/locustfile.py --host http://web:8000
    depends_on:
      - web
    networks:
      - cortex_net

volumes:
  mongo_data:

networks:
  cortex_net:
    driver: bridge
