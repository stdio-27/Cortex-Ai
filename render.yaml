# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: cortex-api
    runtime: docker
    region: oregon
    plan: free
    rootDir: backend
    dockerCommand: python scripts/start_render_demo.py
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: research_copilot
      - key: REDIS_URI
        fromService:
          type: keyvalue
          name: cortex-key-value
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_FAST_MODEL
        value: openai/gpt-oss-20b
      - key: MOCK_LLM_FOR_LOAD_TEST
        value: "false"

  - type: keyvalue
    name: cortex-key-value
    region: oregon
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: "off"
